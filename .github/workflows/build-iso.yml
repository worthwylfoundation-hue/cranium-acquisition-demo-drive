name: Acquisition Demo ISO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate acquisition drive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify pinned Kernel snapshot
        run: bash scripts/verify-kernel-snapshot.sh ecosystem/canonical-kernel-source
      - run: bash -n BUILD_ACQUISITION_ISO.sh HEALTH_CHECK.sh
      - run: bash HEALTH_CHECK.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate Commander build
        working-directory: ecosystem/commander
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build
